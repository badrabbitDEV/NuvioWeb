
<svg xmlns="http://www.w3.org/2000/svg"
     width="512" height="512" viewBox="0 0 512 512">

  <defs>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#28c4df"/>
      <stop offset="55%" stop-color="#147dc9"/>
      <stop offset="100%" stop-color="#5147d5"/>
    </linearGradient>

    <linearGradient id="purple" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7956e8"/>
      <stop offset="100%" stop-color="#d23ee9"/>
    </linearGradient>

    <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#24b9d8"/>
      <stop offset="100%" stop-color="#50e0e8"/>
    </linearGradient>
  </defs>

  <!-- Corpo externo -->
  <path
    d="M 2,90
       C 2,25 66,-15 125,12
       L 453,199
       C 532,244 532,306 453,351
       L 126,500
       C 65,528 2,486 2,421 Z"
    fill="url(#purple)"
  />

  <!-- Região azul -->
  <path
    d="M 2,90
       C 2,25 66,-15 125,12
       L 285,218
       C 224,147 129,109 2,90 Z"
    fill="url(#cyan)"
  />

  <path
    d="M 2,90
       C 2,25 66,-15 125,12
       L 285,218
       C 194,160 100,127 2,90 Z"
    fill="url(#blue)"
  />

  <!-- Região inferior azul/roxa -->
  <path
    d="M 2,90
       C 2,180 2,330 2,421
       C 2,480 40,513 94,505
       C 70,407 94,302 164,252
       L 285,218
       C 218,161 108,112 2,90 Z"
    fill="#5144bb"
    opacity=".65"
  />

  <!-- Recorte central -->
  <path
    d="M 117,185
       C 117,162 142,145 164,151
       L 309,237
       C 341,255 341,285 309,303
       L 164,386
       C 141,399 117,382 117,357 Z"
    fill="#000"
    stroke="#fff"
    stroke-width="2"
  />

  <!-- Play central -->
  <path
    d="M 171,237
       C 171,222 182,215 196,223
       L 248,254
       C 262,262 262,275 248,283
       L 196,314
       C 182,322 171,315 171,300 Z"
    fill="#fff"
  />

  <!-- Contorno -->
  <path
    d="M 2,90
       C 2,25 66,-15 125,12
       L 453,199
       C 532,244 532,306 453,351
       L 126,500
       C 65,528 2,486 2,421 Z"
    fill="none"
    stroke="#fff"
    stroke-width="2"
    opacity=".8"
  />
</svg>
    
